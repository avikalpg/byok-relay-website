name: Agent docs sync

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-agent-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public agent docs match byok-relay canonical sources
        run: npm run check:agent-docs
