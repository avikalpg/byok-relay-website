<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="#1a1a1a"/>
  
  <!-- Orange border -->
  <rect x="20" y="20" width="472" height="472" rx="80" stroke="#FF6600" stroke-width="16" fill="none"/>
  
  <!-- Central node -->
  <circle cx="256" cy="256" r="40" fill="#FF6600"/>
  
  <!-- Horizontal line -->
  <line x1="60" y1="256" x2="216" y2="256" stroke="#FF6600" stroke-width="12" stroke-linecap="round"/>
  <line x1="296" y1="256" x2="452" y2="256" stroke="#FF6600" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Vertical line -->
  <line x1="256" y1="60" x2="256" y2="216" stroke="#FF6600" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="296" x2="256" y2="452" stroke="#FF6600" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Curved connections (neural network style) -->
  <!-- Top-left curve -->
  <path d="M 256 256 Q 180 180, 100 120" stroke="#FF6600" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Top-right curve -->
  <path d="M 256 256 Q 332 180, 412 120" stroke="#FF6600" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Bottom-left curve -->
  <path d="M 256 256 Q 180 332, 100 392" stroke="#FF6600" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Bottom-right curve -->
  <path d="M 256 256 Q 332 332, 412 392" stroke="#FF6600" stroke-width="12" fill="none" stroke-linecap="round"/>
</svg>
